name: Manual AI Lead Triage Trigger

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level for triage execution'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warning
      lead_name:
        description: 'Lead Name'
        required: true
        default: 'FC Lion Test Lead'
      status_detail:
        description: 'Status / Notes'
        required: true
        default: 'Processed Successfully'

jobs:
  run-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Data to Zapier / Google Sheets
        run: |
          curl -X POST "${{ secrets.ZAPIER_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "timestamp": "'$(date -u +"%Y-%m-%d %H:%M:%S")'",
            "log_level": "${{ github.event.inputs.log_level }}",
            "lead_name": "${{ github.event.inputs.lead_name }}",
            "status": "${{ github.event.inputs.status_detail }}"
          }'
